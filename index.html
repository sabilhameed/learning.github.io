  paper: "#FFFFFF",
  ink: "#1A1612",         // charcoal
  inkSub: "#5C5448",
  inkMute: "#9A9080",

  red: "#D4452F",         // coral, for over-forecast / excess
  redSoft: "#FBE5DE",
  green: "#5A8A6F",       // sage, for healthy / on-target
  greenSoft: "#DBE8DD",
  amber: "#D9921F",       // for under-forecast / lost sale

  ink2: "#2A1F18",
};

const F_DISPLAY = `'Aptos Display', 'Aptos', 'Segoe UI', system-ui, -apple-system, sans-serif`;
const F_BODY = `'Aptos', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif`;
const F_MONO = `'Cascadia Mono', 'Cascadia Code', Consolas, 'Courier New', monospace`;

// Per-unit economics for the lipstick — used throughout to make consequences concrete
const UNIT_PRICE = 120;     // AED retail
const UNIT_COST = 35;       // AED COGS
const HOLDING_COST_PER_MONTH = 3;  // AED to hold one unit per month
const MARKDOWN_LOSS = 50;   // AED average loss per unit when marked down
const LOST_MARGIN = UNIT_PRICE - UNIT_COST; // AED missed per stockout

// ═════════════════════════════════════════════════════════════════
// CHAPTER 1 — Meet the SKU
// ═════════════════════════════════════════════════════════════════
function Chapter1() {
  const [forecast, setForecast] = useState(1000);
  const [revealed, setRevealed] = useState(false);
  const ACTUAL = 1380;

  const gap = ACTUAL - forecast;
  const overOrUnder = forecast > ACTUAL ? "OVER" : forecast < ACTUAL ? "UNDER" : "PERFECT";

  return (
    <ChapterShell num="01" title="Meet a single lipstick.">
      <p style={pStyle}>
        Last month, we needed to forecast demand for one product:
        <strong> Rouge Velvet N°14</strong>. A bestseller, but seasonal.
        Before the month begins, you had to commit a number to the supply chain.
        That number triggers production, shipping, and shelf placement weeks in advance.
      </p>

      <div style={{
        background: C.paper, border: `1px solid ${C.hairline}`, padding: 32,
        marginTop: 32, borderRadius: 4,
      }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 32, alignItems: "center" }}>
          {/* Lipstick visual */}
          <div style={{ display: "flex", justifyContent: "center" }}>
            <Lipstick scale={1} />
          </div>
          {/* Slider */}
          <div>
            <div style={{ fontFamily: F_MONO, fontSize: 10, letterSpacing: "0.2em", color: C.inkMute, marginBottom: 8 }}>
              YOUR FORECAST  /  UNITS
            </div>
            <div style={{
              fontFamily: F_DISPLAY, fontWeight: 700, fontSize: 56,
              lineHeight: 1, letterSpacing: "-0.02em", fontFeatureSettings: '"tnum"',
            }}>
              {forecast.toLocaleString()}
            </div>
            <input
              type="range" min="500" max="2000" step="50"
              value={forecast}
              onChange={(e) => { setForecast(Number(e.target.value)); setRevealed(false); }}
              style={{ width: "100%", marginTop: 16 }}
            />
            <div style={{ display: "flex", justifyContent: "space-between", fontFamily: F_MONO, fontSize: 10, color: C.inkMute, marginTop: 4 }}>
              <span>500</span><span>2,000</span>
            </div>
          </div>
        </div>

        {!revealed && (
          <button
            onClick={() => setRevealed(true)}
            style={{
              marginTop: 32, padding: "14px 28px",
              background: C.ink, color: C.bg, border: "none",
              fontFamily: F_MONO, fontSize: 12, letterSpacing: "0.16em",
              cursor: "pointer", borderRadius: 2,
            }}
          >
            REVEAL WHAT ACTUALLY SOLD  →
          </button>
        )}

        {revealed && (
          <div className="fade-in" style={{ marginTop: 32, paddingTop: 32, borderTop: `1px solid ${C.hairline}` }}>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 24 }}>
              <Stat label="YOU FORECAST" value={forecast.toLocaleString()} sub="units" />
              <Stat label="ACTUAL SALES" value={ACTUAL.toLocaleString()} sub="units" accent={C.ink} />
              <Stat
                label="THE GAP"
                value={`${gap >= 0 ? "+" : ""}${gap.toLocaleString()}`}
                sub={overOrUnder === "PERFECT" ? "spot on" : overOrUnder === "OVER" ? "over-forecast" : "under-forecast"}
                accent={overOrUnder === "OVER" ? C.red : overOrUnder === "UNDER" ? C.amber : C.green}
              />
            </div>

            <div style={{ marginTop: 32 }}>
              {overOrUnder === "PERFECT" && (
                <Insight color={C.green}>
                  <strong>Bullseye.</strong> You forecast the exact number that sold. In real life
                  this almost never happens — and if it does, someone got lucky.
                </Insight>
              )}
              {overOrUnder === "OVER" && (
                <Insight color={C.red}>
                  <strong>You over-forecast by {Math.abs(gap).toLocaleString()} units.</strong>{" "}
                  Those units are sitting in the warehouse, costing money to store, eating cash flow,
                  and heading toward markdown. Roughly{" "}
                  <strong>AED {(Math.abs(gap) * MARKDOWN_LOSS).toLocaleString()}</strong> in margin
                  is at risk if we have to discount them.
                </Insight>
              )}
              {overOrUnder === "UNDER" && (
                <Insight color={C.amber}>
                  <strong>You under-forecast by {Math.abs(gap).toLocaleString()} units.</strong>{" "}
                  That's {Math.abs(gap).toLocaleString()} customers who walked into a Sephora,
                  found an empty shelf, and left.{" "}
                  <strong>AED {(Math.abs(gap) * LOST_MARGIN).toLocaleString()}</strong> in margin
                  walked out the door with them. Some of them won't come back.
                </Insight>
              )}
            </div>
          </div>
        )}
      </div>

      <p style={{ ...pStyle, fontStyle: "italic", color: C.inkSub, marginTop: 32 }}>
        Try the slider. See what it feels like to be 200 units off in either direction.
        Both sides cost real money — they just cost it differently.
      </p>
    </ChapterShell>
  );
}

// ═════════════════════════════════════════════════════════════════
// CHAPTER 2 — Both sides hurt, in different ways
// ═════════════════════════════════════════════════════════════════
function Chapter2() {
  const FORECAST = 1000;
  const [actual, setActual] = useState(700);

  const gap = actual - FORECAST;
  const isOver = gap < 0;       // forecast > actual → excess
  const isUnder = gap > 0;      // forecast < actual → stockout

  // Costs
  const excessUnits = isOver ? Math.abs(gap) : 0;
  const stockoutUnits = isUnder ? gap : 0;
  const excessCost = excessUnits * (HOLDING_COST_PER_MONTH + MARKDOWN_LOSS * 0.3); // 30% chance hits markdown
  const lostRevenue = stockoutUnits * UNIT_PRICE;
  const lostMargin = stockoutUnits * LOST_MARGIN;

  return (
    <ChapterShell num="02" title="Both sides hurt — but they hurt differently.">
      <p style={pStyle}>
        Here's the trap most people fall into: thinking forecast accuracy is just one number.
        It isn't. <strong>Over-forecasting and under-forecasting are two completely different
        diseases.</strong> Same symptom on a spreadsheet (a gap), totally different damage to the
        business.
      </p>

      <div style={{
        background: C.paper, border: `1px solid ${C.hairline}`, padding: 32, marginTop: 32, borderRadius: 4,
      }}>
        <div style={{ marginBottom: 24 }}>
          <div style={{ fontFamily: F_MONO, fontSize: 10, letterSpacing: "0.2em", color: C.inkMute, marginBottom: 8 }}>
            FORECAST WAS  1,000  /  DRAG TO SET WHAT ACTUALLY SOLD
          </div>
          <input
            type="range" min="400" max="1600" step="50"
            value={actual}
            onChange={(e) => setActual(Number(e.target.value))}
            style={{ width: "100%" }}
          />
          <div style={{ display: "flex", justifyContent: "space-between", fontFamily: F_MONO, fontSize: 10, color: C.inkMute, marginTop: 6 }}>
            <span>400</span>
            <span style={{ color: C.ink, fontWeight: 600 }}>ACTUAL: {actual.toLocaleString()} units</span>
            <span>1,600</span>
          </div>
        </div>

        {/* Two-column visual scenario */}
        <div style={{
          display: "grid", gridTemplateColumns: "1fr 1fr", gap: 24, marginTop: 32,
        }}>
          {/* Excess scenario */}
          <ScenarioCard
            tone="over"
            active={isOver}
            label="THE OVER-FORECAST PROBLEM"
            headline={isOver ? "Excess inventory" : "—"}
            visual={<WarehouseStack units={excessUnits} />}
            stats={[
              { label: "Excess units", value: excessUnits.toLocaleString() },
              { label: "Holding + markdown risk", value: `AED ${Math.round(excessCost).toLocaleString()}` },
            ]}
            consequences={[
              "Cash tied up in slow-moving stock",
              "Warehouse space consumed",
              "Markdown pressure damages brand price perception",
              "Eventually written off as E&O",
            ]}
          />

          {/* Stockout scenario */}
          <ScenarioCard
            tone="under"
            active={isUnder}
            label="THE UNDER-FORECAST PROBLEM"
            headline={isUnder ? "Stockouts" : "—"}
            visual={<EmptyShelf units={stockoutUnits} />}
            stats={[
              { label: "Lost units", value: stockoutUnits.toLocaleString() },
              { label: "Missed revenue", value: `AED ${lostRevenue.toLocaleString()}` },
            ]}
            consequences={[
              "Customers find empty shelves and leave",
              "Loyalty damaged — they may switch brand",
              "Marketing campaigns drive traffic to nothing",
              "Sales team can't hit targets they don't control",
            ]}
          />
        </div>

        {gap === 0 && (
          <Insight color={C.green}>
            <strong>You hit it exactly.</strong> No excess, no stockout. This is the goal — and
            why we measure forecast accuracy religiously. Move the slider to see what happens
            when reality drifts in either direction.
          </Insight>
        )}
      </div>

      <p style={{ ...pStyle, fontStyle: "italic", color: C.inkSub, marginTop: 32 }}>
        This is why a planner's least favorite question is{" "}
        <em>"is the forecast right?"</em> — the right answer is always{" "}
        <em>"right in which direction, by how much, and for which SKU?"</em>
      </p>
    </ChapterShell>
  );
}

// ═════════════════════════════════════════════════════════════════
// CHAPTER 3 — Putting a number on it
// ═════════════════════════════════════════════════════════════════
function Chapter3() {
  const FORECAST = 1000;
  const [actual, setActual] = useState(1380);

  const error = Math.abs(FORECAST - actual);
  const errorPct = (error / actual) * 100;
  const accuracy = Math.max(0, 100 - errorPct);

  return (
    <ChapterShell num="03" title="Now we can put a number on it.">
      <p style={pStyle}>
        Once you accept that gaps cost money, the next question is:{" "}
        <em>how big a gap?</em> That's where the math comes in — and don't worry, it's the same
        math you'd do without thinking about it.
      </p>

      <div style={{
        background: C.paper, border: `1px solid ${C.hairline}`, padding: 32, marginTop: 32, borderRadius: 4,
      }}>
        <div style={{ marginBottom: 24 }}>
          <div style={{ fontFamily: F_MONO, fontSize: 10, letterSpacing: "0.2em", color: C.inkMute, marginBottom: 8 }}>
            FORECAST: 1,000  /  ACTUAL SALES (DRAG)
          </div>
          <input
            type="range" min="300" max="2000" step="20"
            value={actual}
            onChange={(e) => setActual(Number(e.target.value))}
            style={{ width: "100%" }}
          />
          <div style={{ display: "flex", justifyContent: "space-between", fontFamily: F_MONO, fontSize: 10, color: C.inkMute, marginTop: 6 }}>
            <span>300</span>
            <span style={{ color: C.ink, fontWeight: 600 }}>ACTUAL: {actual.toLocaleString()}</span>
            <span>2,000</span>
          </div>
        </div>

        {/* Visual gap bar */}
        <GapBar forecast={FORECAST} actual={actual} />

        {/* Step-by-step calculation */}
        <div style={{ marginTop: 32, display: "flex", flexDirection: "column", gap: 12 }}>
          <CalcStep
            num="1"
            label="The gap, in units"
            formula={`|${FORECAST.toLocaleString()} − ${actual.toLocaleString()}|`}
            result={`${error.toLocaleString()} units`}
          />
          <CalcStep
            num="2"
            label="The gap, as a percentage of actual"
            formula={`${error.toLocaleString()} ÷ ${actual.toLocaleString()} × 100`}
            result={`${errorPct.toFixed(1)}% error`}
            accent={C.red}
          />
          <CalcStep
            num="3"
            label="Flip it — the part we got right"
            formula={`100% − ${errorPct.toFixed(1)}%`}
            result={`${accuracy.toFixed(1)}% accuracy`}
            accent={C.green}
            big
          />
        </div>

        <Insight color={C.ink}>
          That last number — <strong>forecast accuracy</strong> — is what you'll see on dashboards
          and in S&OP reviews. It's just a more flattering way of saying{" "}
          <em>"we were 22% wrong."</em> Same information, more positive spin.
        </Insight>
      </div>
    </ChapterShell>
  );
}

// ═════════════════════════════════════════════════════════════════
// CHAPTER 4 — The averaging trap
// ═════════════════════════════════════════════════════════════════
function Chapter4() {
  const skus = [
    { name: "Hero Foundation",     forecast: 9800, actual: 10000, color: C.ink },
    { name: "Hero Mascara",        forecast: 14500, actual: 15000, color: C.ink },
    { name: "Bestseller Lipstick", forecast: 7900, actual: 8000,  color: C.ink },
    { name: "Niche Eye Liner",     forecast: 100, actual: 50,     color: C.inkMute },
    { name: "Niche Brow Pencil",   forecast: 80, actual: 30,      color: C.inkMute },
  ];

  // Simple per-SKU error %
  const skusEnriched = skus.map(s => ({
    ...s,
    errorPct: Math.abs(s.forecast - s.actual) / s.actual * 100,
    absErr: Math.abs(s.forecast - s.actual),
  }));

  // Plain average (the trap)
  const plainAvg = skusEnriched.reduce((sum, s) => sum + s.errorPct, 0) / skusEnriched.length;
  // Weighted (what planners actually use)
  const totalActual = skus.reduce((s, x) => s + x.actual, 0);
  const totalAbsErr = skusEnriched.reduce((s, x) => s + x.absErr, 0);
  const weightedErrorPct = (totalAbsErr / totalActual) * 100;

  return (
    <ChapterShell num="04" title="Now we have five products. The math gets sneaky.">
      <p style={pStyle}>
        One product is easy. A real portfolio has hundreds. So how do we combine all those
        accuracy numbers into one headline figure? <strong>This is where it goes wrong for most
        people.</strong>
      </p>

      <div style={{
        background: C.paper, border: `1px solid ${C.hairline}`, padding: 32, marginTop: 32, borderRadius: 4,
      }}>
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 14 }}>
          <thead>
            <tr style={{ borderBottom: `2px solid ${C.ink}` }}>
              <th style={{ ...thStyle, textAlign: "left" }}>SKU</th>
              <th style={thStyle}>Forecast</th>
              <th style={thStyle}>Actual</th>
              <th style={thStyle}>Error %</th>
            </tr>
          </thead>
          <tbody>
            {skusEnriched.map((s, i) => (
              <tr key={i} style={{ borderBottom: `1px solid ${C.hairline}` }}>
                <td style={{ ...tdStyle, color: s.color, fontWeight: i < 3 ? 600 : 400 }}>
                  {s.name}
                </td>
                <td style={{ ...tdStyle, textAlign: "right", fontFamily: F_MONO }}>{s.forecast.toLocaleString()}</td>
                <td style={{ ...tdStyle, textAlign: "right", fontFamily: F_MONO }}>{s.actual.toLocaleString()}</td>
                <td style={{
                  ...tdStyle, textAlign: "right", fontFamily: F_MONO, fontWeight: 600,
                  color: s.errorPct > 30 ? C.red : s.errorPct > 10 ? C.amber : C.green,
                }}>
                  {s.errorPct.toFixed(1)}%
                </td>
              </tr>
            ))}
          </tbody>
        </table>

        {/* Two contrasting cards */}
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginTop: 32 }}>
          <div style={{
            border: `2px solid ${C.red}`, padding: 20, borderRadius: 4, background: C.redSoft,
          }}>
            <div style={{ fontFamily: F_MONO, fontSize: 10, letterSpacing: "0.16em", color: C.red, marginBottom: 8 }}>
              ✗  THE NAIVE AVERAGE  (a.k.a. MAPE)
            </div>
            <div style={{ fontFamily: F_DISPLAY, fontSize: 42, fontWeight: 700, color: C.red, lineHeight: 1 }}>
              {plainAvg.toFixed(1)}% error
            </div>
            <div style={{ fontSize: 13, color: C.ink, marginTop: 12, lineHeight: 1.5 }}>
              "Just average the error percentages."<br/>
              <em style={{ color: C.inkSub }}>
                Two tiny products with huge percentage errors drag the whole portfolio down,
                even though they barely matter to the business.
              </em>
            </div>
          </div>

          <div style={{
            border: `2px solid ${C.green}`, padding: 20, borderRadius: 4, background: C.greenSoft,
          }}>
            <div style={{ fontFamily: F_MONO, fontSize: 10, letterSpacing: "0.16em", color: C.green, marginBottom: 8 }}>
              ✓  WEIGHTED BY VOLUME  (a.k.a. WMAPE)
            </div>
            <div style={{ fontFamily: F_DISPLAY, fontSize: 42, fontWeight: 700, color: C.green, lineHeight: 1 }}>
              {weightedErrorPct.toFixed(1)}% error
            </div>
            <div style={{ fontSize: 13, color: C.ink, marginTop: 12, lineHeight: 1.5 }}>
              "Weight every SKU by how much it actually sold."<br/>
              <em style={{ color: C.inkSub }}>
                Big sellers count for more — because if you nail forecasts on your top 3,
                you've nailed 90% of the business.
              </em>
            </div>
          </div>
        </div>

        <Insight color={C.ink}>
          <strong>This is why the right metric matters.</strong> The plain average (MAPE) says we
          had a terrible month. The weighted version (WMAPE) says we were excellent on the SKUs
          that mattered. <em>Same data. Two stories.</em> When a planner shows you forecast
          accuracy, ask which version. The honest answer for portfolios is always the weighted one.
        </Insight>
      </div>
    </ChapterShell>
  );
}

// CHAPTER 5 — Direction matters: Bias
// ═════════════════════════════════════════════════════════════════
function Chapter5() {
  // Two 6-month series with the same accuracy but different bias profiles
  const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN"];
  const seriesA = [ // Consistently over-forecasting
    { f: 1100, a: 1000 }, { f: 1080, a: 980 }, { f: 1150, a: 1050 },
    { f: 1120, a: 1020 }, { f: 1090, a: 990 }, { f: 1130, a: 1030 },
  ];
  const seriesB = [ // Random / bouncing
    { f: 1100, a: 1000 }, { f: 920, a: 1020 }, { f: 1080, a: 980 },
    { f: 940, a: 1040 }, { f: 1100, a: 1000 }, { f: 960, a: 1060 },
  ];

  const summary = (s) => {
    const totalA = s.reduce((sum, x) => sum + x.a, 0);
    const totalErr = s.reduce((sum, x) => sum + Math.abs(x.f - x.a), 0);
    const totalSigned = s.reduce((sum, x) => sum + (x.f - x.a), 0);
    return {
      wmape: (totalErr / totalA) * 100,
      bias: (totalSigned / totalA) * 100,
    };
  };
  const sumA = summary(seriesA);
  const sumB = summary(seriesB);

  return (
    <ChapterShell num="05" title="Two forecasts, same accuracy, totally different problems.">
      <p style={pStyle}>
        Accuracy on its own doesn't tell you whether you're <em>consistently</em> wrong or
        <em> randomly</em> wrong. That distinction is huge — one is a fixable process problem,
        the other is just the nature of demand.
      </p>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginTop: 32 }}>
        <SeriesCard
          title="Planner A"
          subtitle="Always a little over."
          months={months}
          series={seriesA}
          wmape={sumA.wmape}
          bias={sumA.bias}
          diagnosis="Chronic over-forecasting. Probably an optimism bias, or hedging against stockouts. Easy to fix once you see it: subtract a correction factor."
          diagnosisColor={C.red}
        />
        <SeriesCard
          title="Planner B"
          subtitle="Bounces around, balances out."
          months={months}
          series={seriesB}
          wmape={sumB.wmape}
          bias={sumB.bias}
          diagnosis="Random error. Sometimes high, sometimes low — but on average, dead on. This is what good forecasting looks like. The remaining error is just demand volatility."
          diagnosisColor={C.green}
        />
      </div>

      <Insight color={C.ink}>
        Both planners have <strong>almost identical accuracy ({sumA.wmape.toFixed(1)}% vs{" "}
        {sumB.wmape.toFixed(1)}% error)</strong>. But Planner A leaves a trail of excess inventory
        every single month. Planner B's misses cancel out. <em>Bias</em> — the direction of error —
        is the second number you should always ask for.
      </Insight>

      <p style={{ ...pStyle, fontStyle: "italic", color: C.inkSub, marginTop: 32 }}>
        Rule of thumb: if you only ever look at one accuracy number,{" "}
        <strong>look at two</strong> — accuracy AND bias. They're cheap together.
      </p>
    </ChapterShell>
  );
}

// CHAPTER 7 — TEST YOURSELF

function QuizChapter() {
  const questions = [
    {
      q: "Last month, your hero lipstick had a forecast of 1,000 units. Actual sales were 1,300 units. Which scenario did we just experience?",
      options: [
        "Excess inventory piling up in the warehouse",
        "Stockouts — customers found empty shelves",
        "A perfect forecast",
        "A standard markdown event",
      ],
      correct: 1,
      explain: "Forecast (1,000) was lower than actual demand (1,300) — meaning 300 customers showed up that we didn't plan for. Empty shelves, lost sales, and lost margin walked out with them.",
    },
    {
      q: "If forecast = 800 and actual = 1,000, what's our forecast accuracy?",
      options: ["120%", "80%", "20%", "Not enough information"],
      correct: 1,
      explain: "Error = |800 − 1,000| ÷ 1,000 = 20%. Flip it: 100% − 20% = 80% accuracy. Same calculation regardless of direction — over or under, the gap is the gap.",
    },
    {
      q: "Three hero SKUs forecast within 2%. Two tiny niche SKUs were 80% off. Simple-average error reads 33%. Volume-weighted error reads 3%. Which number is more honest for the business?",
      options: [
        "The simple average — every product is equal",
        "The weighted version — volume reflects business reality",
        "Both are equally valid, pick whichever",
        "Always the lower one — execs prefer good news",
      ],
      correct: 1,
      explain: "Plain average treats a 50-unit SKU the same as a 50,000-unit hero. WMAPE weights each error by how much that SKU actually sold — which is exactly how the P&L weights it too.",
    },
    {
      q: "Planner A is consistently 10% over every single month. Planner B's errors bounce randomly between +15% and −15%. Both have similar overall accuracy. Whose pattern is more concerning?",
      options: [
        "Planner B — too unpredictable",
        "Planner A — chronic bias means a systematic, fixable problem we're ignoring",
        "Neither — same accuracy, same problem",
        "Both equally — bias is bias",
      ],
      correct: 1,
      explain: "Planner B's errors are demand noise — they cancel out. Planner A is leaving excess inventory every single month, costing real cash. Bias is a process problem you can fix; randomness usually isn't.",
    },
    {
      q: "Marketing launches a major TikTok campaign that drives a demand spike. The forecast was locked in 4 months ago — before anyone knew about the campaign. Most likely outcome?",
      options: [
        "Excess inventory and markdowns",
        "Stockouts and lost sales",
        "Perfect forecast — campaigns always balance out",
        "No impact — forecasts adjust in real time",
      ],
      correct: 1,
      explain: "When demand creation outpaces what supply chain planned for, customers find empty shelves. The campaign drove paid traffic to nothing. This is exactly why marketing and demand planning need a shared activation calendar.",
    },
    {
      q: "What's the question to bring to your next S&OP review?",
      options: [
        "What was our forecast accuracy this month?",
        "What was the average MAPE across all SKUs?",
        "What was our weighted accuracy AND bias on the top 10 SKUs by volume — and is the bias getting better or worse?",
        "How many SKUs did we forecast?",
      ],
      correct: 2,
      explain: "Three things in one question: weighted (not naïve), top SKUs (where the money is), AND bias (direction matters). Plus the trend — one number is a snapshot, the trend is the story.",
    },
  ];

  const [current, setCurrent] = useState(0);
  const [selected, setSelected] = useState(null);
  const [answers, setAnswers] = useState([]);
  const [done, setDone] = useState(false);

  const handleSelect = (idx) => {
    if (selected !== null) return; // lock once answered
    setSelected(idx);
    setAnswers([...answers, idx === questions[current].correct]);
  };

  const handleNext = () => {
    if (current < questions.length - 1) {
      setCurrent(current + 1);
      setSelected(null);
    } else {
      setDone(true);
    }
  };

  const handleRestart = () => {
    setCurrent(0);
    setSelected(null);
    setAnswers([]);
    setDone(false);
  };

  const score = answers.filter(Boolean).length;

  // ─── RESULTS SCREEN ─────────────────────────────────────────────
  if (done) {
    const tier =
      score === 6 ? { label: "Forecast Oracle", color: C.green, msg: "Perfect score. You should be running the S&OP review, not attending it. Frame this and bring it to your next 1:1." } :
      score >= 4 ? { label: "Solid Grasp", color: C.green, msg: "You'd hold your own in any planning conversation. The math doesn't scare you anymore — and it shouldn't." } :
      score >= 2 ? { label: "Getting There", color: C.amber, msg: "The fundamentals are landing. A second pass through the chapters will lock in the parts that slipped." } :
      { label: "Worth Another Read", color: C.red, msg: "No shame — most people who use the word 'forecast' professionally couldn't define WMAPE either. Scroll back up. The second time will stick." };

            YOUR SCORE
          </div>
          <div style={{
            fontFamily: F_DISPLAY, fontWeight: 900, fontStyle: "italic",
            fontSize: "clamp(80px, 14vw, 140px)", lineHeight: 1, color: tier.color,
            letterSpacing: "-0.04em", fontFeatureSettings: '"tnum"',
          }}>
            {score}<span style={{ color: C.hairline, fontWeight: 400 }}>/6</span>
          </div>
          <div style={{
            fontFamily: F_DISPLAY, fontWeight: 700, fontStyle: "italic",
            fontSize: 36, marginTop: 20, color: C.ink, letterSpacing: "-0.02em",
          }}>
            {tier.label}.
          </div>
          <div style={{
            fontSize: 17, color: C.inkSub, marginTop: 16,
            maxWidth: 560, marginLeft: "auto", marginRight: "auto", lineHeight: 1.55,
          }}>
            {tier.msg}
          </div>

          {/* Question-by-question recap */}
          <div style={{
            marginTop: 40, paddingTop: 32, borderTop: `1px solid ${C.hairline}`,
            display: "flex", justifyContent: "center", gap: 8, flexWrap: "wrap",
          }}>
            {answers.map((correct, i) => (
              <div key={i} style={{
                width: 36, height: 36, borderRadius: "50%",
                background: correct ? C.greenSoft : C.redSoft,
                border: `2px solid ${correct ? C.green : C.red}`,
                color: correct ? C.green : C.red,
                fontFamily: F_MONO, fontSize: 13, fontWeight: 700,
                display: "flex", alignItems: "center", justifyContent: "center",
              }}>
                {correct ? "✓" : "✗"}
              </div>
            ))}
          </div>

          <button onClick={handleRestart} style={{
            marginTop: 32, padding: "14px 28px", background: C.ink, color: C.bg, border: "none",
            fontFamily: F_MONO, fontSize: 12, letterSpacing: "0.16em",
            cursor: "pointer", borderRadius: 2,
          }}>
            TRY AGAIN  ↻
          </button>
        </div>
      </ChapterShell>
    );
  }

  // ─── QUESTION SCREEN ────────────────────────────────────────────
  const q = questions[current];
  const isCorrect = selected === q.correct;

  return (
    <ChapterShell num="07" title="Test yourself.">
      <p style={pStyle}>
        Six questions. No penalty for getting them wrong — the explanations after each one
        are the real point. Pick what you think, see what's right, and why.
      </p>

      <div style={{
        background: C.paper, border: `1px solid ${C.hairline}`, padding: 36,
        marginTop: 32, borderRadius: 4,
      }}>
        {/* Progress bar */}
        <div style={{ display: "flex", gap: 6, marginBottom: 28 }}>
          {questions.map((_, i) => (
            <div key={i} style={{
              flex: 1, height: 4, borderRadius: 2,
              background:
                i < current ? (answers[i] ? C.green : C.red) :
                i === current ? C.ink : C.hairline,
              transition: "background 0.3s",
            }} />
          ))}
        </div>

        <div style={{
          fontFamily: F_MONO, fontSize: 11, letterSpacing: "0.18em",
          color: C.inkMute, marginBottom: 16,
        }}>
          QUESTION  {String(current + 1).padStart(2, "0")}  /  {String(questions.length).padStart(2, "0")}
        </div>

        <h3 style={{
          fontFamily: F_DISPLAY, fontWeight: 700, fontSize: "clamp(22px, 3vw, 28px)",
          lineHeight: 1.25, margin: 0, marginBottom: 28, letterSpacing: "-0.01em",
        }}>
          {q.q}
        </h3>

        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {q.options.map((opt, i) => {
            const isSelectedOpt = selected === i;
            const isCorrectOpt = i === q.correct;
            let borderCol = C.hairline;
            let bgCol = "transparent";
            let badgeBg = C.hairline;
            let badgeColor = C.inkSub;
            let badgeChar = String.fromCharCode(65 + i);

            if (selected !== null) {
              if (isCorrectOpt) {
                borderCol = C.green;
                bgCol = C.greenSoft;
                badgeBg = C.green;
                badgeColor = "#FFFFFF";
                badgeChar = "✓";
              } else if (isSelectedOpt) {
                borderCol = C.red;
                bgCol = C.redSoft;
                badgeBg = C.red;
                badgeColor = "#FFFFFF";
                badgeChar = "✗";
              }
            }

            return (
              <button
                key={i}
                onClick={() => handleSelect(i)}
                disabled={selected !== null}
                onMouseEnter={(e) => {
                  if (selected === null) e.currentTarget.style.borderColor = C.ink;
                }}
                onMouseLeave={(e) => {
                  if (selected === null) e.currentTarget.style.borderColor = C.hairline;
                }}
                style={{
                  display: "flex", alignItems: "center", gap: 14,
                  padding: "16px 20px",
                  border: `2px solid ${borderCol}`,

                  fontFamily: F_BODY, fontSize: 15, color: C.ink,

                  fontFamily: F_MONO, fontSize: 12, fontWeight: 700,

      </div>
    </ChapterShell>
  );
}

function WarehouseStack({ units }) {
  // Visualize excess as stacked boxes
  const boxes = Math.min(20, Math.ceil(units / 30));
  if (units === 0) return <div style={{ fontFamily: F_MONO, fontSize: 11, color: C.inkMute }}>No excess</div>;

  return (
    <div style={{ display: "flex", flexDirection: "column-reverse", alignItems: "center", gap: 2 }}>
      {Array.from({ length: boxes }).map((_, i) => {
        const w = 60 - (i * 1.5);
        return (
          <div key={i} style={{
            width: w, height: 9,
            background: C.red, opacity: 0.4 + (i / boxes) * 0.5,
            borderRadius: 1,
          }} />
        );
      })}
      <div style={{ fontFamily: F_MONO, fontSize: 9, color: C.red, marginTop: 6, fontWeight: 600 }}>
        WAREHOUSE
      </div>
    </div>
  );
}

function EmptyShelf({ units }) {
  if (units === 0) return <div style={{ fontFamily: F_MONO, fontSize: 11, color: C.inkMute }}>Shelf full</div>;
  // Show empty hooks / gaps
  return (
    <div>
      <div style={{
        display: "flex", gap: 6, padding: "12px 8px",
        borderBottom: `2px solid ${C.amber}`,
      }}>
        {Array.from({ length: 5 }).map((_, i) => (
          <div key={i} style={{
            width: 12, height: 30,
            background: i < 1 ? C.amber : "transparent",

            opacity: i < 1 ? 0.4 : 1,

      <div style={{ fontFamily: F_MONO, fontSize: 9, color: C.amber, marginTop: 6, fontWeight: 600, textAlign: "center" }}>
        EMPTY SHELF
      </div>
    </div>
  );
}

function GapBar({ forecast, actual }) {
  const max = Math.max(forecast, actual);
  const fW = (forecast / max) * 100;
  const aW = (actual / max) * 100;
  const isOver = forecast > actual;

  return (
    <div style={{ marginTop: 16 }}>
      {/* Forecast row */}
      <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12 }}>
        <div style={{ width: 80, fontFamily: F_MONO, fontSize: 10, color: C.inkMute, letterSpacing: "0.12em" }}>
          FORECAST
        </div>
        <div style={{ flex: 1, height: 28, background: C.hairline, position: "relative", borderRadius: 2 }}>
          <div className="grow-bar" style={{
            width: `${fW}%`, height: "100%", background: C.ink, borderRadius: 2,
          }} />
          <span style={{
            position: "absolute", left: `${Math.min(fW, 92)}%`,
            top: "50%", transform: "translateY(-50%)", paddingLeft: 8,
            fontFamily: F_MONO, fontSize: 12, fontWeight: 600,
          }}>
            {forecast.toLocaleString()}
          </span>
        </div>
      </div>
      {/* Actual row */}
      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
        <div style={{ width: 80, fontFamily: F_MONO, fontSize: 10, color: C.inkMute, letterSpacing: "0.12em" }}>
          ACTUAL
        </div>
        <div style={{ flex: 1, height: 28, background: C.hairline, position: "relative", borderRadius: 2 }}>
          <div className="grow-bar" style={{
            width: `${aW}%`, height: "100%",
            background: isOver ? C.amber : C.red, borderRadius: 2,
          }} />
          <span style={{
            position: "absolute", left: `${Math.min(aW, 92)}%`,
            top: "50%", transform: "translateY(-50%)", paddingLeft: 8,
            fontFamily: F_MONO, fontSize: 12, fontWeight: 600,
          }}>
            {actual.toLocaleString()}
          </span>
        </div>
      </div>
    </div>
  );
}
